name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AQT_VERSION: 3.3.0
  QT_VERSION: 6.9.3

jobs:
  changes:
    name: Select affected components
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.targets.outputs.linux }}
      android: ${{ steps.targets.outputs.android }}
      server: ${{ steps.targets.outputs.server }}
      quickshell: ${{ steps.targets.outputs.quickshell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -p 'test_ci_targets.py'
      - id: targets
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: python3 tools/ci_targets.py >> "$GITHUB_OUTPUT"

  quickshell:
    name: Quick Shell syntax checks
    needs: changes
    if: needs.changes.outputs.quickshell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check plugin files
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-declarative-dev-tools
          cd plugins/omarchy-waypoint
          /usr/lib/qt6/bin/qmlformat ./*.qml >/dev/null
          for script in ./*.js; do
            sed '/^\.pragma library$/d' "$script" | node --check
          done
          python3 -m json.tool manifest.json >/dev/null

  linux:
    name: Linux build and tests
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
          python3 -m pip install --user "aqtinstall==${AQT_VERSION}"
      - name: Install Qt
        run: |
          python3 -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "${RUNNER_TEMP}/Qt"
      - name: Configure
        run: |
          cmake --preset dev \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset dev
      - name: Lint
        run: cmake --build build/dev --target waypoint_qmllint

  server:
    name: Server checks and container build
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test and lint server
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          # rsa and libsqlite3-sys are inactive, lockfile-only sqlx dependencies.
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459

      - name: Build server image
        run: docker build --tag waypoint-api .

  android:
    name: Android arm64 build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build openjdk-17-jdk-headless
          python3 -m pip install --user "aqtinstall==${AQT_VERSION}"
      - name: Install Qt
        run: |
          python3 -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 \
            --outputdir "${RUNNER_TEMP}/Qt"
          python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a \
            --outputdir "${RUNNER_TEMP}/Qt"
      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
      - name: Build APK
        env:
          ANDROID_ABI: arm64-v8a
          ANDROID_BUILD_TYPE: Debug
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          QT_ANDROID_ROOT: ${{ runner.temp }}/Qt/6.9.3/android_arm64_v8a
          QT_HOST_ROOT: ${{ runner.temp }}/Qt/6.9.3/gcc_64
          # CI intentionally omits Firebase values; polling fallback remains enabled.
        run: bin/build-android
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waypoint-android-arm64-debug
          path: waypoint-android-arm64-debug.apk
          if-no-files-found: error

  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, quickshell, linux, server, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected jobs to succeed
        shell: bash
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes as $changes |
            $changes.result == "success" and
            all(to_entries[] | select(.key != "changes");
              $changes.outputs[.key] as $selected |
              ($selected == "true" and .value.result == "success") or
              ($selected == "false" and .value.result == "skipped")
            )
          ' <<< "$JOBS"
